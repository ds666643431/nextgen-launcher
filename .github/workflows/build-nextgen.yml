name: Build NextGen APK (ZH)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate Android SDK
        run: |
          FOUND=""
          for d in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" /usr/local/lib/android/sdk /opt/android-sdk; do
            if [ -n "$d" ] && [ -d "$d" ]; then FOUND="$d"; break; fi
          done
          if [ -z "$FOUND" ]; then echo "no sdk found"; exit 1; fi
          echo "SDK_ROOT=$FOUND" >> $GITHUB_ENV
          echo "NDK_HOME=$FOUND/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "FOUND=$FOUND"
          ls "$FOUND"

      - name: Install NDK 27.0.12077973
        run: |
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;27.0.12077973" "platforms;android-35" "build-tools;35.0.0" 2>&1 | tail -10
          ls "$SDK_ROOT/ndk"

      - name: Install Rust + cargo-ndk
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          source "$HOME/.cargo/env"
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          cargo --version
          cargo ndk --version

      - name: Build libloader.so (Rust, ZH)
        working-directory: native/loader
        run: |
          source "$HOME/.cargo/env"
          export ANDROID_NDK_HOME="$NDK_HOME"
          cargo ndk -t arm64-v8a -p 28 -o ../vendor/NextGEN/app/src/main/jniLibs build --release 2>&1 | tail -40
          echo "--- produced ---"
          ls -la ../vendor/NextGEN/app/src/main/jniLibs/arm64-v8a/

      - name: Write local.properties
        run: |
          echo "sdk.dir=$SDK_ROOT" > vendor/NextGEN/local.properties
          cat vendor/NextGEN/local.properties

      - name: Bump gradle heap
        run: |
          cd vendor/NextGEN
          sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8/' gradle.properties
          grep jvmargs gradle.properties

      - name: Build arm64 release
        working-directory: vendor/NextGEN
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 | tail -100

      - name: List outputs
        if: always()
        run: |
          find vendor/NextGEN/app/build/outputs -type f -name '*.apk' -exec ls -la {} \; 2>/dev/null || echo "no apk"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NextGen-ZH-APK
          path: vendor/NextGEN/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
